name: Docker images and Catalyst development

on:
  push:
    branches: [main, feat/fintrack-modern-ui]
    paths:
      - 'backend/**'
      - 'ml-service/**'
      - 'ops/catalyst/**'
      - '.github/workflows/catalyst-docker.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'ml-service/**'
      - 'ops/catalyst/**'
      - '.github/workflows/catalyst-docker.yml'
  workflow_dispatch:

permissions:
  contents: read

# Serialize publishing/deployment so an older run cannot overwrite a newer one.
concurrency:
  group: catalyst-development-${{ github.event_name == 'pull_request' && github.ref || 'release' }}
  cancel-in-progress: false

env:
  DOCKERHUB_USERNAME: abhishek12439525
  PUBLISH_IMAGES: ${{ github.event_name != 'pull_request' && (vars.CATALYST_CI_ENABLED == 'true' || github.event_name == 'workflow_dispatch') }}

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Verify backend, including AI authentication contract
        working-directory: backend
        run: ./mvnw -B -ntp verify
      - name: Verify deployment failure handling
        run: python3 -m unittest discover -s ops/catalyst -p 'test_*.py' -v
      - uses: docker/setup-buildx-action@v3
      - name: Build AI image
        uses: docker/build-push-action@v6
        with:
          context: ml-service
          platforms: linux/amd64
          load: true
          tags: fintrack-ai:test
          cache-from: type=gha,scope=fintrack-ai
          cache-to: type=gha,mode=max,scope=fintrack-ai
      - name: Test real model, HTTP validation, authentication, and health in Docker
        run: >-
          docker run --rm --network none
          -v "$GITHUB_WORKSPACE/ml-service/tests:/tests:ro"
          -e FINTRACK_BUNDLE=/app
          fintrack-ai:test python3 -m unittest discover -s /tests -v
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/amd64
          load: true
          tags: fintrack-api:test
          cache-from: type=gha,scope=fintrack-api
          cache-to: type=gha,mode=max,scope=fintrack-api
      - name: Verify API container default and Catalyst ports with MongoDB
        run: python3 ops/catalyst/verify_api_container.py --image fintrack-api:test
      - name: Sign in to Docker Hub
        if: env.PUBLISH_IMAGES == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish tested images
        if: env.PUBLISH_IMAGES == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for service in ai api; do
            image="$DOCKERHUB_USERNAME/fintrack-$service"
            docker tag "fintrack-$service:test" "$image:sha-$GITHUB_SHA"
            docker push "$image:sha-$GITHUB_SHA"
            docker tag "fintrack-$service:test" "$image:development"
            docker push "$image:development"
            echo "Published \`$image:sha-$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/setup-node@v4
        if: env.PUBLISH_IMAGES == 'true' && vars.CATALYST_AUTO_DEPLOY == 'true'
        with:
          node-version: '22'
      - name: Install pinned Catalyst CLI
        if: env.PUBLISH_IMAGES == 'true' && vars.CATALYST_AUTO_DEPLOY == 'true'
        run: npm install --global zcatalyst-cli@1.28.0
      - name: Deploy AI image and API Java 21 JAR to Catalyst Development and check health
        if: env.PUBLISH_IMAGES == 'true' && vars.CATALYST_AUTO_DEPLOY == 'true'
        env:
          CATALYST_TOKEN: ${{ secrets.CATALYST_TOKEN }}
          CATALYST_PROJECT_ID: ${{ vars.CATALYST_PROJECT_ID }}
          CATALYST_ORG_ID: ${{ vars.CATALYST_ORG_ID }}
          CATALYST_DC: in
          AI_URL: ${{ vars.CATALYST_AI_URL }}
          API_URL: ${{ vars.CATALYST_API_URL }}
        run: bash ops/catalyst/deploy.sh
