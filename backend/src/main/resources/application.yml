server:
  port: ${X_ZOHO_CATALYST_LISTEN_PORT:${PORT:5001}}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
spring:
  application:
    name: expense-tracker-api
  config:
    import: optional:file:.env[.properties]
  mongodb:
    uri: ${MONGO_URI}
  data:
    mongodb:
      auto-index-creation: true
  jackson:
    deserialization:
      fail-on-unknown-properties: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
app:
  jwt-secret: ${JWT_SECRET}
  jwt-ttl: ${JWT_TTL:7d}
  allowed-origins: ${FRONTEND_URL:http://localhost:5173},http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174
  ml-service-url: ${ML_SERVICE_URL:http://localhost:8000}
  ml-service-api-key: ${ML_SERVICE_API_KEY:}
  ml-timeout: ${ML_TIMEOUT:5s}
  time-zone: ${APP_TIME_ZONE:Asia/Kolkata}
logging:
  level:
    org.springframework.security: WARN
